<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<title>Observability Agent (local test)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
  #log { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; height: 60vh; overflow-y: auto; background: #fafafa; }
  .msg { margin-bottom: 0.75rem; white-space: pre-wrap; }
  .user { color: #0b5; font-weight: 600; }
  .agent { color: #333; }
  form { display: flex; gap: 0.5rem; margin-top: 1rem; }
  input[type=text] { flex: 1; padding: 0.5rem; }
  button { padding: 0.5rem 1rem; }
  #apiKeyRow { margin-bottom: 1rem; font-size: 0.9rem; color: #666; }
  #apiKeyRow input { width: 220px; }
</style>
</head>
<body>
<h2>Observability Agent — local test only</h2>
<div id="apiKeyRow">
  API Key: <input type="password" id="apiKey" placeholder="X-API-Key" />
</div>
<div id="log"></div>
<form id="chatForm">
  <input type="text" id="message" placeholder="Hỏi gì đó về ClickHouse / lỗi hệ thống..." autocomplete="off" />
  <button type="submit">Gửi</button>
</form>

<script>
const sessionId = "browser-" + Math.random().toString(36).slice(2);
const log = document.getElementById("log");
const form = document.getElementById("chatForm");
const messageInput = document.getElementById("message");
const apiKeyInput = document.getElementById("apiKey");

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = (role === "user" ? "Bạn: " : "Agent: ") + text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = messageInput.value.trim();
  if (!message) return;
  addMessage("user", message);
  messageInput.value = "";

  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-API-Key": apiKeyInput.value,
      },
      body: JSON.stringify({ session_id: sessionId, message }),
    });
    const data = await resp.json();
    if (!resp.ok) {
      addMessage("agent", "Lỗi: " + (data.detail || resp.status));
      return;
    }
    addMessage("agent", data.reply);
  } catch (err) {
    addMessage("agent", "Lỗi kết nối: " + err.message);
  }
});
</script>
</body>
</html>
