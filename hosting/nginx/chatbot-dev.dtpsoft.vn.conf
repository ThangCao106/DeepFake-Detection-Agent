server {
    server_name chatbot-dev.dtpsoft.vn;

    # Tăng timeout cho SSE streaming
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8006;
        proxy_http_version 1.1;

        # Headers cho SSE
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/chatbot-dev.dtpsoft.vn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/chatbot-dev.dtpsoft.vn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = chatbot-dev.dtpsoft.vn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name chatbot-dev.dtpsoft.vn;
    return 404; # managed by Certbot


}

# Domain: zalo-dev.dtpsoft.vn (Zalo Client Proxy)
server {
    server_name zalo-dev.dtpsoft.vn;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # WebSockets support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    # n8n — strip /n8n prefix, proxy toàn bộ
    # =========================================
    location = /n8n {
        return 301 https://$host/n8n/home/;
    }

    location /n8n/ {
        rewrite ^/n8n/(.*)$ /$1 break;
        proxy_pass            http://127.0.0.1:5678;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      Upgrade           $http_upgrade;
        proxy_set_header      Connection        $http_connection;
        proxy_buffering       off;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/zalo-dev.dtpsoft.vn/fullchain.pem; # managed by Certbot (should update via certbot later)
    ssl_certificate_key /etc/letsencrypt/live/zalo-dev.dtpsoft.vn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = zalo-dev.dtpsoft.vn) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name zalo-dev.dtpsoft.vn;
    return 404;
}

# Domain: deeptrace.io.vn (DeepTrace Multi-Zone Forensic Platform)
#   - /            -> Public Forensic Studio & Core APIs (127.0.0.1:5000)
#   - /benchmark/  -> Benchmark & Calibration Lab via Nginx Gateway (127.0.0.1:5010)
#   - /dfagent/    -> Forensic SRE Cockpit, Review Queue & Agentic AI Model (127.0.0.1:8787)
server {
    server_name deeptrace.io.vn;

    client_max_body_size 250M;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Zone 3: Forensic SRE Cockpit, Review Queue & C-Dec-POMDP Agentic AI Studio (/dfagent/)
    # ======================================================================================
    location = /dfagent {
        return 301 https://$host/dfagent/;
    }

    location = /dfagent/orchestrator {
        proxy_pass            http://127.0.0.1:5000/dfagent/orchestrator;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
    }

    location = /dfagent/benchmark {
        return 301 https://$host/benchmark/;
    }

    location ^~ /dfagent/benchmark/ {
        rewrite ^/dfagent/benchmark/(.*)$ /$1 break;
        proxy_pass            http://127.0.0.1:5010;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      X-Benchmark-Mode  "1";
        proxy_set_header      Upgrade           $http_upgrade;
        proxy_set_header      Connection        $http_connection;
        proxy_buffering       off;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
    }

    location /dfagent/ {
        rewrite ^/dfagent/(.*)$ /$1 break;
        proxy_pass            http://127.0.0.1:8787;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      Upgrade           $http_upgrade;
        proxy_set_header      Connection        $http_connection;
        proxy_buffering       off;
        proxy_cache           off;
        chunked_transfer_encoding on;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
    }

    # Zone 2: Dedicated Benchmark & Post-Hoc Calibration Hub (/benchmark/)
    # ====================================================================
    location = /benchmark {
        return 301 https://$host/benchmark/;
    }

    location /benchmark/ {
        rewrite ^/benchmark/(.*)$ /$1 break;
        proxy_pass            http://127.0.0.1:5010;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      X-Benchmark-Mode  "1";
        proxy_set_header      Upgrade           $http_upgrade;
        proxy_set_header      Connection        $http_connection;
        proxy_buffering       off;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
    }

    # Socket.IO Real-time Telemetry & Analysis Progress
    # =================================================
    location /socket.io/ {
        proxy_pass            http://127.0.0.1:5000/socket.io/;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      Upgrade           $http_upgrade;
        proxy_set_header      Connection        "upgrade";
        proxy_buffering       off;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
    }

    # Zone 1: Public Forensic Studio, Core APIs, Static Assets & Certificates (/)
    # ===========================================================================
    location / {
        proxy_pass            http://127.0.0.1:5000;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      Upgrade           $http_upgrade;
        proxy_set_header      Connection        $http_connection;
        proxy_buffering       off;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/deeptrace.io.vn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/deeptrace.io.vn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = deeptrace.io.vn) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name deeptrace.io.vn;
    return 404;
}
