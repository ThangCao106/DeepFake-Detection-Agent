name: Scheduled Feedback Review & Triage Job (/dfagent Queue)

on:
  schedule:
    # Run every 4 hours to pre-triage PENDING user feedback in /dfagent
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      api_base:
        description: 'Live DeepTrace base URL to inspect /dfagent pending queue'
        required: false
        default: 'https://deeptrace.io.vn'
      apply_approved_weights:
        description: 'Apply calibration ONLY for feedback already approved on /dfagent?'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: feedback-review-job-${{ github.ref }}
  cancel-in-progress: false

jobs:
  review-feedback-queue:
    name: Audit Pending Feedback & Publish /dfagent Triage Report
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Run Feedback Review & Pre-Triage Job
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          APPLY_FLAG=""
          if [ "${{ github.event.inputs.apply_approved_weights || 'false' }}" = "true" ]; then
            APPLY_FLAG="--apply-approved-weights"
          fi
          python scripts/review_feedback_queue_job.py \
            --api-base "${{ github.event.inputs.api_base || 'https://deeptrace.io.vn' }}" \
            --trigger-source "github_actions_review_job" \
            --output-dir "report_colab/feedback_reviews" \
            $APPLY_FLAG

      - name: 4. Commit Lightweight Triage Reports Only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add report_colab/feedback_reviews/*.json report_colab/feedback_reviews/*.md 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No new triage report changes to commit."
          else
            git commit -m "chore(review): update /dfagent feedback triage report [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase -X ours origin/main && git push origin main; then
                break
              else
                git rebase --abort 2>/dev/null || true
                git pull origin main --no-edit || true
                git push origin main && break || sleep 4
              fi
            done
          fi

      - name: 5. Upload Review Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dfagent-feedback-review-${{ github.run_number }}
          path: |
            report_colab/feedback_reviews/*.json
            report_colab/feedback_reviews/*.md
          retention-days: 14
          if-no-files-found: ignore
