name: Build Android APK (DeepTrace Guardian)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile_app/**'
      - '.github/workflows/build_android_apk.yml'

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Scaffold Flutter App Project
        run: |
          mkdir -p mobile_app
          # Create a clean flutter skeleton project
          flutter create --org vn.io.deeptrace --project-name deeptrace_guard mobile_app/flutter_app
          cd mobile_app/flutter_app
          flutter pub add http

      - name: Inject DeepTrace Live Call Guardian Code
        run: |
          # Copy the customized DeepTrace main.dart if available in repo, else fallback
          if [ -f "mobile_app/main.dart.src" ]; then
            cp mobile_app/main.dart.src mobile_app/flutter_app/lib/main.dart
          fi

      - name: Build Android Release APK
        working-directory: mobile_app/flutter_app
        run: |
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepTrace-Guardian-Release-APK
          path: mobile_app/flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
