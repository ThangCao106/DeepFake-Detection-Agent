name: Build Android APK (DeepTrace Guardian)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile_app/**'

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Initialize Flutter Project Structure
        working-directory: mobile_app
        run: |
          if [ ! -f "flutter_app/pubspec.yaml" ]; then
            echo "Generating Flutter project skeleton..."
            flutter create --org vn.io.deeptrace --project-name deeptrace_guard flutter_app_temp
            cp -r flutter_app_temp/* flutter_app/ || true
            cp -r flutter_app_temp/.* flutter_app/ || true
            rm -rf flutter_app_temp
          fi

      - name: Install Dependencies
        working-directory: mobile_app/flutter_app
        run: |
          flutter pub add http
          flutter pub get

      - name: Build Android Release APK
        working-directory: mobile_app/flutter_app
        run: |
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepTrace-Guardian-Release-APK
          path: mobile_app/flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
