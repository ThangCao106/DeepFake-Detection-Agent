name: Daily Benchmark Job - Human Deepfake Model (24h)

on:
  schedule:
    - cron: '0 2 * * *' # Daily at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-human-benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install torch torchvision numpy Pillow || true

      - name: Run Human-Centric Model Benchmark
        run: |
          python benchmark/eval_benchmark_human.py

      - name: Commit and Push Benchmark Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f report_colab/daily_benchmark/
          git commit -m "Auto-generated daily Human model benchmark [skip ci]" || echo "No changes to commit"
          git pull origin main --rebase || true
          git push origin main
