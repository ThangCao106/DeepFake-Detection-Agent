name: Daily Benchmark Job - Human Deepfake Model (24h)

on:
  schedule:
    - cron: '0 2 * * *' # Daily at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-human-benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install torch torchvision numpy Pillow opencv-python-headless pyarrow pandas || true

      - name: Run Human-Centric Model Benchmark
        run: |
          python benchmark/eval_benchmark_human.py

      - name: Commit and Push Benchmark Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f report_colab/daily_benchmark/
          if git diff --staged --quiet; then
            echo "No new human benchmark reports to commit."
          else
            git commit -m "Auto-generated daily Human model benchmark [skip ci]"
            
            PUSH_SUCCESS=false
            for i in 1 2 3 4 5; do
              echo "==> Push attempt $i/5..."
              git fetch origin main
              if git rebase -X theirs origin/main; then
                if git push origin main; then
                  echo "Successfully pushed benchmark reports to origin main."
                  PUSH_SUCCESS=true
                  break
                fi
              else
                echo "Rebase conflict detected, aborting rebase and merging with -X ours..."
                git rebase --abort || true
                git merge -X ours origin/main -m "Merge remote main into benchmark branch [skip ci]" || true
                if git push origin main; then
                  echo "Successfully merged and pushed benchmark reports."
                  PUSH_SUCCESS=true
                  break
                fi
              fi
              sleep 5
            done
            
            if [ "$PUSH_SUCCESS" = false ]; then
              echo "Warning: Could not push reports to git after 5 retries. Benchmark reports remain logged in runner."
            fi
          fi
