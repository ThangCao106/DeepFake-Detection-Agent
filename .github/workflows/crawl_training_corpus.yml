name: Scheduled Multi-Source Training Corpus Crawler (Scale-Up)

on:
  schedule:
    # Run twice daily (10:00 AM & 10:00 PM UTC+7), staggered away from daily threads ingestion
    - cron: '0 3,15 * * *'
  workflow_dispatch:
    inputs:
      target_images:
        description: 'Target balanced image corpus count'
        required: false
        default: '2000'
      target_sbi_pairs:
        description: 'Target Self-Blended Image counterfactual pairs'
        required: false
        default: '500'
      target_audios:
        description: 'Target multi-channel audio clips'
        required: false
        default: '400'
      push_hf:
        description: 'Upload corpus manifests to Hugging Face Datasets?'
        required: false
        default: true
        type: boolean
      sync_gdrive:
        description: 'Sync corpus manifests to Google Drive?'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: training-corpus-crawler-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harvest-training-corpus:
    name: Harvest Multi-Source Training Corpus & Publish Manifests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Install Lightweight Corpus Harvesting Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg || true
          python -m pip install --upgrade pip
          pip install Pillow numpy datasets huggingface_hub pyarrow soundfile librosa opencv-python-headless || true

      - name: 4. Run Multi-Source Training Corpus Harvester
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_CREDENTIALS_JSON: ${{ secrets.GDRIVE_CREDENTIALS_JSON }}
          GDRIVE_TARGET_FOLDER_ID: ${{ secrets.GDRIVE_TARGET_FOLDER_ID || '1s6G-cscNpEMBbUlvJfb4i24s9_7UVjet' }}
          HF_HUB_ENABLE_HF_TRANSFER: "0"
          PYTHONUNBUFFERED: "1"
        run: |
          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.push_hf || 'true' }}" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --push-hf"
          fi
          if [ "${{ github.event.inputs.sync_gdrive || 'true' }}" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --sync-gdrive"
          fi
          python crawler/training_corpus_harvester.py \
            --output-dir report_colab/corpus \
            --target-images "${{ github.event.inputs.target_images || '2000' }}" \
            --target-sbi-pairs "${{ github.event.inputs.target_sbi_pairs || '500' }}" \
            --target-audios "${{ github.event.inputs.target_audios || '400' }}" \
            $EXTRA_FLAGS

      - name: 5. Commit Lightweight Corpus Manifests & Summary Only (No Media Binaries)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add report_colab/corpus/*.jsonl report_colab/corpus/*.json report_colab/corpus/*.md 2>/dev/null || true
          git add crawler/dedup_registry.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No updated corpus manifests to commit."
          else
            git commit -m "chore(data): auto-harvest multi-source training corpus manifests [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase -X ours origin/main && git push origin main; then
                echo "Successfully pushed lightweight corpus manifests."
                break
              else
                git rebase --abort 2>/dev/null || true
                git pull origin main --no-edit || true
                git push origin main && break || sleep 5
              fi
            done
          fi

      - name: 6. Upload Corpus Manifests Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-corpus-manifests-${{ github.run_number }}
          path: |
            report_colab/corpus/*.jsonl
            report_colab/corpus/*.json
            report_colab/corpus/*.md
          retention-days: 14
          if-no-files-found: ignore
