name: CI/CD Build & Deploy Docker to Server

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'report_colab/**'
      - '**.md'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Docker Compose to Server
    if: "!contains(github.event.head_commit.message, '[Auto-Bot]') && !contains(github.event.head_commit.message, '[Auto-sync]') && !contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    environment: DTP_DEV

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy via SSH Password to Target Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT != '' && secrets.SERVER_PORT || '22' }}
          command_timeout: 30m
          script: |
            # Clean and sanitize TARGET_DIR path string (strip trailing control characters / newlines)
            RAW_DIR="${{ secrets.TARGET_DIR }}"
            TARGET_DIR=$(echo "$RAW_DIR" | tr -d '\r\n' | xargs)
            if [ -z "$TARGET_DIR" ]; then
              TARGET_DIR="$HOME/DeepFake-Detection-Agent"
            fi
            REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

            echo "=========================================="
            echo "🚀 Starting Deployment to Server..."
            echo "=========================================="

            # Verify Docker availability
            if ! command -v docker &> /dev/null; then
              echo "❌ Error: Docker is not installed on server."
              exit 1
            fi

            # Check Container Status & Ports 5000 / 8787 Availability
            echo "🔍 Checking container status and Ports 5000 & 8787..."
            
            # 1. Stop existing containers by name
            for CONTAINER_NAME in deepfake_detection_web observability_agent; do
              RUNNING_CID=$(docker ps -q -f name=$CONTAINER_NAME)
              if [ -n "$RUNNING_CID" ]; then
                echo "🛑 Container '$CONTAINER_NAME' is running ($RUNNING_CID). Stopping container..."
                docker stop $CONTAINER_NAME || true
                docker rm -f $CONTAINER_NAME || true
              fi
            done

            # 2. Check if any docker container is binding Port 5000 or 8787
            for PORT_NUM in 5000 8787; do
              CONTAINER_BY_PORT=$(docker ps -q -f publish=$PORT_NUM)
              if [ -n "$CONTAINER_BY_PORT" ]; then
                echo "⚠️ Port $PORT_NUM is occupied by container ID(s): $CONTAINER_BY_PORT. Stopping occupied container(s)..."
                docker stop $CONTAINER_BY_PORT || true
                docker rm -f $CONTAINER_BY_PORT || true
              else
                echo "✅ Port $PORT_NUM is free and available."
              fi
            done

            # Clone or Pull Repository using GITHUB_TOKEN for authentication
            if [ -d "$TARGET_DIR/.git" ]; then
              echo "🔄 Pulling latest code from origin/main..."
              cd "$TARGET_DIR"
              git remote set-url origin "$REPO_URL"
              git fetch --all
              git reset --hard origin/main
              git pull origin main
            else
              echo "📦 Cleaning incomplete directory and cloning fresh repository..."
              rm -rf "$TARGET_DIR"
              mkdir -p "$TARGET_DIR"
              git clone "$REPO_URL" "$TARGET_DIR"
              cd "$TARGET_DIR"
            fi

            # Verify docker-compose.yml exists
            if [ ! -f "docker-compose.yml" ]; then
              echo "❌ Error: docker-compose.yml missing in $TARGET_DIR after clone/pull!"
              pwd
              ls -la
              exit 1
            fi

            # Backup & Preserve existing keys from .env and report_colab persistent backup
            OLD_GEMINI=""
            OLD_CLAUDE=""
            OLD_MUSE=""
            OLD_MUSE_MODE=""
            OLD_MUSE_MODEL=""

            if [ -f .env ]; then
              OLD_GEMINI=$(grep "^GEMINI_API_KEY=" .env | cut -d '=' -f2- | tr -d '\r\n' | xargs)
              OLD_CLAUDE=$(grep "^CLAUDE_API_KEY=" .env | cut -d '=' -f2- | tr -d '\r\n' | xargs)
              OLD_MUSE=$(grep "^META_MUSE_API_KEY=" .env | cut -d '=' -f2- | tr -d '\r\n' | xargs)
              OLD_MUSE_MODE=$(grep "^MUSE_ENGINE_MODE=" .env | cut -d '=' -f2- | tr -d '\r\n' | xargs)
              OLD_MUSE_MODEL=$(grep "^MUSE_MODEL=" .env | cut -d '=' -f2- | tr -d '\r\n' | xargs)
            fi

            if [ -z "$OLD_GEMINI" ] && [ -f report_colab/.credentials/.env.backup ]; then
              OLD_GEMINI=$(grep "^GEMINI_API_KEY=" report_colab/.credentials/.env.backup | cut -d '=' -f2- | tr -d '\r\n' | xargs)
            fi
            if [ -z "$OLD_CLAUDE" ] && [ -f report_colab/.credentials/.env.backup ]; then
              OLD_CLAUDE=$(grep "^CLAUDE_API_KEY=" report_colab/.credentials/.env.backup | cut -d '=' -f2- | tr -d '\r\n' | xargs)
            fi
            if [ -z "$OLD_MUSE" ] && [ -f report_colab/.credentials/.env.backup ]; then
              OLD_MUSE=$(grep "^META_MUSE_API_KEY=" report_colab/.credentials/.env.backup | cut -d '=' -f2- | tr -d '\r\n' | xargs)
            fi

            SECRET_GEMINI="${{ secrets.GEMINI_API_KEY }}"
            SECRET_CLAUDE="${{ secrets.CLAUDE_API_KEY }}"

            FINAL_GEMINI="$OLD_GEMINI"
            if [ -n "$SECRET_GEMINI" ] && [ "$SECRET_GEMINI" != "null" ]; then
              FINAL_GEMINI="$SECRET_GEMINI"
            fi

            FINAL_CLAUDE="$OLD_CLAUDE"
            if [ -n "$SECRET_CLAUDE" ] && [ "$SECRET_CLAUDE" != "null" ]; then
              FINAL_CLAUDE="$SECRET_CLAUDE"
            fi

            FINAL_MUSE_MODE="${OLD_MUSE_MODE:-EMBEDDED_LOCAL}"
            FINAL_MUSE_MODEL="${OLD_MUSE_MODEL:-meta-muse-spark}"

            echo "⚙️ Updating environment variables (.env with preserved keys)..."
            echo "PORT=5000" > .env
            echo "GEMINI_API_KEY=${FINAL_GEMINI}" >> .env
            echo "CLAUDE_API_KEY=${FINAL_CLAUDE}" >> .env
            echo "META_MUSE_API_KEY=${OLD_MUSE}" >> .env
            echo "MUSE_ENGINE_MODE=${FINAL_MUSE_MODE}" >> .env
            echo "MUSE_MODEL=${FINAL_MUSE_MODEL}" >> .env
            echo "OBSERVABILITY_AGENT_URL=http://observability-agent:8787" >> .env

            # Build Docker Image & Run Container with Docker Compose (Reusing Layer Cache)
            echo "🐳 Building Docker images (reusing layer cache) & launching containers..."
            if docker compose version &> /dev/null; then
              docker compose down --remove-orphans || true
              docker compose build
              docker compose up -d --force-recreate
            elif command -v docker-compose &> /dev/null; then
              docker-compose down --remove-orphans || true
              docker-compose build
              docker-compose up -d --force-recreate
            else
              echo "❌ Error: Neither 'docker compose' nor 'docker-compose' command found."
              exit 1
            fi

            # Cleanup unused dangling images
            echo "🧹 Cleaning up dangling Docker images..."
            docker image prune -f

            # Perform Healthcheck
            echo "🏥 Verifying service deployment health..."
            sleep 10
            if curl -s -f http://localhost:5000/api/status > /dev/null; then
              echo "✅ Web UI Deployment Successful! Service running on http://localhost:5000"
            else
              echo "⚠️ Warning: Web UI healthcheck endpoint did not respond immediately, checking logs..."
              docker logs deepfake_detection_web --tail 20
            fi

            if curl -s -f http://localhost:8787/api/auth/status > /dev/null || curl -s -f -H "Authorization: Bearer observability-agent-key" http://localhost:8787/v1/models > /dev/null || curl -s http://localhost:8787/ > /dev/null; then
              echo "✅ Observability Subsystem Agent is running on http://localhost:8787"
            else
              echo "⚠️ Warning: Observability Agent on port 8787 did not respond immediately, checking logs..."
              docker logs observability_agent --tail 20 2>/dev/null || docker compose logs --tail 20 observability-agent 2>/dev/null || true
            fi
