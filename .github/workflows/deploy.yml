name: CI/CD Build & Deploy Docker to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Docker Compose to Server
    runs-on: ubuntu-latest
    environment: DTP_DEV

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy via SSH Password to Target Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT != '' && secrets.SERVER_PORT || '22' }}
          script: |
            TARGET_DIR="${{ secrets.TARGET_DIR }}"
            if [ -z "$TARGET_DIR" ]; then
              TARGET_DIR="$HOME/DeepFake-Detection-Agent"
            fi
            REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

            echo "=========================================="
            echo "🚀 Starting Deployment to Server..."
            echo "=========================================="

            # Verify Docker availability
            if ! command -v docker &> /dev/null; then
              echo "❌ Error: Docker is not installed on server."
              exit 1
            fi

            # Clone or Pull Repository using GITHUB_TOKEN for authentication
            if [ -d "$TARGET_DIR/.git" ]; then
              echo "🔄 Pulling latest code from origin/main..."
              cd "$TARGET_DIR"
              git remote set-url origin "$REPO_URL"
              git fetch --all
              git reset --hard origin/main
              git pull origin main
            else
              echo "📦 Cleaning incomplete directory and cloning fresh repository..."
              rm -rf "$TARGET_DIR"
              mkdir -p "$TARGET_DIR"
              git clone "$REPO_URL" "$TARGET_DIR"
              cd "$TARGET_DIR"
            fi

            # Verify docker-compose.yml exists
            if [ ! -f "docker-compose.yml" ]; then
              echo "❌ Error: docker-compose.yml missing in $TARGET_DIR after clone/pull!"
              pwd
              ls -la
              exit 1
            fi

            # Create / Update .env File
            echo "⚙️ Updating environment variables (.env)..."
            cat <<EOF > .env
            PORT=5000
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            EOF

            # Build Docker Image & Run Container with Docker Compose
            echo "🐳 Building Docker image & launching containers..."
            if docker compose version &> /dev/null; then
              docker compose down --remove-orphans || true
              docker compose build --no-cache
              docker compose up -d --force-recreate
            elif command -v docker-compose &> /dev/null; then
              docker-compose down --remove-orphans || true
              docker-compose build --no-cache
              docker-compose up -d --force-recreate
            else
              echo "❌ Error: Neither 'docker compose' nor 'docker-compose' command found."
              exit 1
            fi

            # Cleanup unused dangling images
            echo "🧹 Cleaning up dangling Docker images..."
            docker image prune -f

            # Perform Healthcheck
            echo "🏥 Verifying service deployment health..."
            sleep 8
            if curl -s -f http://localhost:5000/api/status > /dev/null; then
              echo "✅ Deployment Successful! Service is running on http://localhost:5000"
            else
              echo "⚠️ Warning: Healthcheck endpoint did not respond immediately, checking logs..."
              docker logs deepfake_detection_web --tail 20
            fi
