name: Daily Threads Crawler & Data Ingestion (Option C Drive-First)

on:
  schedule:
    # Chạy tự động hàng ngày lúc 00:00 UTC (07:00 AM giờ Việt Nam UTC+7)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      num_images:
        description: 'Số lượng ảnh chân dung thật cần thu thập (Images)'
        required: false
        default: '250'
      num_videos:
        description: 'Số lượng video talking head thật (Videos)'
        required: false
        default: '25'
      num_audios:
        description: 'Số lượng audio giọng nói tiếng Việt (Audios)'
        required: false
        default: '25'
      num_fakes:
        description: 'Số lượng ảnh đối kháng FaceSwap & Diffusion (Adversarial Fakes)'
        required: false
        default: '25'
      vault_only:
        description: 'Chỉ dùng Vietnam Face Vault offline (không cào internet)?'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: threads-crawler-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crawl-and-sync-data:
    name: Crawl Threads Data & Sync Google Drive
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: 2. Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 3. Install System & Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless numpy pandas pyarrow Pillow httpx playwright transformers huggingface_hub google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib || true
          pip install -r requirements.txt || true
          python -m playwright install chromium --with-deps || true

      - name: 4. Execute Crawler & Option C Data Pipeline
        env:
          GDRIVE_CREDENTIALS_JSON: ${{ secrets.GDRIVE_CREDENTIALS_JSON }}
          GDRIVE_TARGET_FOLDER_ID: ${{ secrets.GDRIVE_TARGET_FOLDER_ID || '1s6G-cscNpEMBbUlvJfb4i24s9_7UVjet' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          THREADS_SESSION_COOKIES: ${{ secrets.THREADS_SESSION_COOKIES }}
          THREADS_VAULT_ONLY: ${{ github.event.inputs.vault_only || 'false' }}
          CRAWL_NUM_IMAGES: ${{ github.event.inputs.num_images || '250' }}
          CRAWL_NUM_VIDEOS: ${{ github.event.inputs.num_videos || '25' }}
          CRAWL_NUM_AUDIOS: ${{ github.event.inputs.num_audios || '25' }}
          CRAWL_NUM_FAKES: ${{ github.event.inputs.num_fakes || '25' }}
        run: |
          echo "=========================================================================="
          echo "🚀 Khởi chạy Job Cào Threads & Sinh Dữ liệu Đa Phương Thức trên GitHub Actions"
          echo "   Chỉ tiêu: Images=$CRAWL_NUM_IMAGES | Videos=$CRAWL_NUM_VIDEOS | Audios=$CRAWL_NUM_AUDIOS | Fakes=$CRAWL_NUM_FAKES"
          echo "   Vault-Only Mode: $THREADS_VAULT_ONLY"
          echo "=========================================================================="
          python crawler/daily_pentest_pipeline.py \
            --images "$CRAWL_NUM_IMAGES" \
            --videos "$CRAWL_NUM_VIDEOS" \
            --audios "$CRAWL_NUM_AUDIOS" \
            --fakes "$CRAWL_NUM_FAKES"

      - name: 5. Commit and Push Updated Manifests & Reports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Clean untracked temp database
          git rm --cached report_colab/deepfake_agent_memory.db 2>/dev/null || true
          
          # Only stage report summaries, parquet metadata, and json manifests (no large binaries)
          git add report_colab/pentest/*.json report_colab/pentest/*.md report_colab/pentest/*.parquet 2>/dev/null || true
          git add crawler/dedup_registry.json 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "✅ Dữ liệu đã đồng bộ lên Google Drive / Hugging Face. Không có báo cáo mới cần commit vào Git."
          else
            git commit -m "chore(data): auto-sync daily Threads crawler manifests and registry [skip ci]"
            for attempt in 1 2 3; do
              echo "Push attempt $attempt/3..."
              git fetch origin main
              if git rebase -X ours origin/main && git push origin main; then
                echo "✅ Successfully pushed manifests to GitHub main branch."
                break
              else
                echo "Rebase conflict, retrying merge..."
                git rebase --abort 2>/dev/null || true
                git pull origin main --no-edit || true
                git push origin main && break || sleep 5
              fi
            done
          fi

      - name: 6. Upload Crawled Media Dataset as Artifact (Direct Download)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-threads-dataset-run-${{ github.run_number }}
          path: |
            report_colab/pentest/**
            crawler/dedup_registry.json
          retention-days: 14
          if-no-files-found: ignore
