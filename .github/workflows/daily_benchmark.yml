name: Daily Benchmark & Commercial Tools Search

on:
  schedule:
    # Runs every day at 00:00 UTC (7:00 AM VN time)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  run-daily-benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install torch torchvision numpy Pillow huggingface_hub || true

      - name: Run Daily Benchmark Pipeline
        run: |
          python benchmark/daily_benchmark_search.py

      - name: Commit and Push Daily Benchmark Reports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add report_colab/daily_benchmark/
          git commit -m "Auto-generated daily benchmark report [skip ci]" || echo "No changes to commit"
          git push origin main
