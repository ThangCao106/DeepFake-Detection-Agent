# Lightweight reverse proxy on Port 5010 forwarding /benchmark traffic to Core Web UI (:5000)
# Eliminates duplicate multi-GB PyTorch/ViT container while preserving Production Nginx :5010 upstream.
server {
    listen 5010;
    server_name _;
    client_max_body_size 250M;

    location / {
        proxy_pass http://deepfake-web-ui:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Benchmark-Mode "1";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
