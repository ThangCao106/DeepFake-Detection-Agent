version: '3.8'

services:
  # =========================================================
  # 🌐 1. FORENSIC WEB UI (Public Forensic Verification - Port 5000)
  # =========================================================
  deepfake-web-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deepfake_detection_web
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - OBSERVABILITY_AGENT_URL=http://observability-agent:8787
      - SHORT_VIDEO_AUTO_JOB_ENABLED=${SHORT_VIDEO_AUTO_JOB_ENABLED:-0}
      - CUSTOM_VIT_HF_REPO=${CUSTOM_VIT_HF_REPO:-ThangCao/custom-deepfake-vit}
    volumes:
      # Persistent storage for uploaded media (Image, Video, Audio)
      - ./uploads:/app/uploads
      # Persistent storage for benchmark runs, live logs & generated reports
      - ./runs/benchmarks:/app/runs/benchmarks
      # Live hot-reload/sync for application code, trained checkpoints & calibration weights
      - ./web_ui:/app/web_ui
      - ./benchmark:/app/benchmark
      - ./agents:/app/agents
      - ./forensics_kernel:/app/forensics_kernel
      - ./observability/ppo_meta_controller.py:/app/observability/ppo_meta_controller.py
      - ./custom_vit_model:/app/custom_vit_model
      - ./human_vit_model:/app/human_vit_model
      - ./models:/app/models
      - ./report_colab:/app/report_colab
      # Cache Hugging Face model weights so they are not re-downloaded on container restart
      - hf_model_cache:/root/.cache/huggingface
    depends_on:
      - observability-agent
    networks:
      - deepfake-agent-network

  # =========================================================
  # ⚡ 2. LIGHTWEIGHT BENCHMARK GATEWAY PROXY (Port 5010 -> Core :5000)
  # =========================================================
  deepfake-benchmark-hub:
    image: nginx:alpine
    container_name: deepfake_benchmark_hub
    restart: unless-stopped
    ports:
      - "5010:5010"
    volumes:
      - ./nginx_benchmark_proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - deepfake-web-ui
    networks:
      - deepfake-agent-network

  # =========================================================
  # 🔍 3. OBSERVABILITY SUBSYSTEM (SRE Claude Agent Service)
  # =========================================================
  observability-agent:
    build:
      context: ./observability
      dockerfile: Dockerfile
    container_name: observability_agent
    restart: unless-stopped
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      - PORT=8787
      - ANTHROPIC_API_KEY=${CLAUDE_API_KEY}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - META_MUSE_API_KEY=${META_MUSE_API_KEY:-}
      - MUSE_ENGINE_MODE=${MUSE_ENGINE_MODE:-EMBEDDED_LOCAL}
      - MUSE_MODEL=${MUSE_MODEL:-meta-muse-spark}
      - DEEPFAKE_WEB_UI_URL=http://deepfake-web-ui:5000
    volumes:
      - claude-home-new:/home/agent
      - ./report_colab:/app/report_colab
      - ./observability/static:/app/static
      - ./custom_vit_model:/app/custom_vit_model:ro
      - ./human_vit_model:/app/human_vit_model:ro
    networks:
      - deepfake-agent-network

  # =========================================================
  # 🔑 CLAUDE CLI LOGIN AUTHENTICATION SERVICE
  # =========================================================
  login:
    image: node:22-slim
    container_name: claude_login
    profiles: ["login"]
    stdin_open: true
    tty: true
    environment:
      - HOME=/home/agent
      - NPM_CONFIG_PREFIX=/home/agent/.npm-global
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
    volumes:
      - claude-home-new:/home/agent
    working_dir: /home/agent
    entrypoint: ["sh", "-c"]
    command:
      - >
        echo "==========================================" &&
        echo "🔑 STARTING CLAUDE CLI LOGIN AUTHENTICATION" &&
        echo "==========================================" &&
        echo "📂 [1/3] Preparing environment & npm PATH..." &&
        mkdir -p "$$HOME/.npm-global" &&
        export PATH="$$HOME/.npm-global/bin:$$PATH" &&
        echo "📦 [2/3] Installing @anthropic-ai/claude-code CLI package..." &&
        npm install -g @anthropic-ai/claude-code &&
        chown -R 1000:1000 "$$HOME" 2>/dev/null || true &&
        echo "🚀 [3/3] Launching interactive 'claude login'..." &&
        echo "👉 Copy/paste the OAuth authorization link below into your browser:" &&
        echo "------------------------------------------------------------------" &&
        claude login &&
        echo "------------------------------------------------------------------" &&
        echo "✅ Claude Authentication Completed Successfully!" &&
        echo "   Credentials saved to persistent volume 'claude-home-new'." &&
        echo "=========================================="

networks:
  deepfake-agent-network:
    driver: bridge

volumes:
  hf_model_cache:
    driver: local
  claude-home-new:
    driver: local
