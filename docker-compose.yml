version: '3.8'

services:
  # =========================================================
  # 🌐 1. WEB UI & INFERENCE APP (Flask Web Server & Multi-Agent)
  # =========================================================
  deepfake-web-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deepfake_detection_web
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - OBSERVABILITY_AGENT_URL=http://observability-agent:8787
    volumes:
      # Persistent storage for uploaded media (Image, Video, Audio)
      - ./uploads:/app/uploads
      # Cache Hugging Face model weights so they are not re-downloaded on container restart
      - hf_model_cache:/root/.cache/huggingface
    depends_on:
      - observability-agent
    networks:
      - deepfake-agent-network

  # =========================================================
  # 🔍 3. OBSERVABILITY SUBSYSTEM (SRE Claude Agent Service)
  # =========================================================
  observability-agent:
    build:
      context: ./observability
      dockerfile: Dockerfile
    container_name: observability_agent
    restart: unless-stopped
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      - PORT=8787
      - ANTHROPIC_API_KEY=${CLAUDE_API_KEY}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
    volumes:
      - claude_agent_home:/home/agent
    networks:
      - deepfake-agent-network

  # =========================================================
  # 🔑 CLAUDE CLI LOGIN AUTHENTICATION SERVICE
  # =========================================================
  login:
    image: node:22-slim
    container_name: claude_login
    profiles: ["login"]
    user: "1000:1000"
    stdin_open: true
    tty: true
    environment:
      - HOME=/home/agent
      - NPM_CONFIG_PREFIX=/home/agent/.npm-global
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
    volumes:
      - claude_agent_home:/home/agent
    working_dir: /home/agent
    entrypoint: ["sh", "-c"]
    command:
      - >
        echo "==========================================" &&
        echo "🔑 STARTING CLAUDE CLI LOGIN AUTHENTICATION" &&
        echo "==========================================" &&
        echo "📂 [1/3] Preparing environment & npm PATH..." &&
        mkdir -p "$$HOME/.npm-global" &&
        export PATH="$$HOME/.npm-global/bin:$$PATH" &&
        echo "📦 [2/3] Installing @anthropic-ai/claude-code CLI package..." &&
        npm install -g @anthropic-ai/claude-code &&
        echo "🚀 [3/3] Launching interactive 'claude login'..." &&
        echo "👉 Copy/paste the OAuth authorization link below into your browser:" &&
        echo "------------------------------------------------------------------" &&
        claude login &&
        echo "------------------------------------------------------------------" &&
        echo "✅ Claude Authentication Completed Successfully!" &&
        echo "   Credentials saved to persistent volume 'claude_agent_home'." &&
        echo "=========================================="

networks:
  deepfake-agent-network:
    driver: bridge

volumes:
  hf_model_cache:
    driver: local
  claude_agent_home:
    driver: local
