version: '3.8'

services:
  deepfake-detection-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deepfake_detection_web
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      # Persistent storage for uploaded images
      - ./uploads:/app/uploads
      # Cache Hugging Face model weights so they are not re-downloaded on container restart
      - hf_model_cache:/root/.cache/huggingface

volumes:
  hf_model_cache:
    driver: local
