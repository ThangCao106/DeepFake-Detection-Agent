services:
  ai-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-agent
    env_file:
      - .env
    environment:
      - HOME=/home/agent
      - NPM_CONFIG_PREFIX=/home/agent/.npm-global
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - http_proxy=${HTTP_PROXY:-}
      - https_proxy=${HTTPS_PROXY:-}
    ports:
      - "8787:8787"
    volumes:
      - claude-home-new:/home/agent
      - ../report_colab:/app/report_colab
    restart: unless-stopped

  login:
    image: node:22-slim
    container_name: claude_login
    profiles: ["login"]
    stdin_open: true
    tty: true
    environment:
      - HOME=/home/agent
      - NPM_CONFIG_PREFIX=/home/agent/.npm-global
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
    volumes:
      - claude-home-new:/home/agent
    working_dir: /home/agent
    entrypoint: ["sh", "-c"]
    command:
      - >
        echo "==========================================" &&
        echo "🔑 STARTING CLAUDE CLI LOGIN AUTHENTICATION" &&
        echo "==========================================" &&
        echo "📂 [1/3] Preparing environment & npm PATH..." &&
        mkdir -p "$$HOME/.npm-global" &&
        export PATH="$$HOME/.npm-global/bin:$$PATH" &&
        echo "📦 [2/3] Installing @anthropic-ai/claude-code CLI package..." &&
        npm install -g @anthropic-ai/claude-code &&
        chown -R 1000:1000 "$$HOME" 2>/dev/null || true &&
        echo "🚀 [3/3] Launching interactive 'claude login'..." &&
        echo "👉 Copy/paste the OAuth authorization link below into your browser:" &&
        echo "------------------------------------------------------------------" &&
        claude login &&
        echo "------------------------------------------------------------------" &&
        echo "✅ Claude Authentication Completed Successfully!" &&
        echo "   Credentials saved to persistent volume 'claude-home-new'." &&
        echo "=========================================="

volumes:
  claude-home-new:
